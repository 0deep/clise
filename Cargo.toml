[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.dependencies]
ratatui = { version = "=0.30.2", features = ["crossterm_0_29"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
serde-saphyr = "=2.0.0"
toml = "=1.1.8"
toml_edit = "=0.25.17"
thiserror = "=2.0.21"
